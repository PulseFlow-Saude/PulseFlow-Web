<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PulseFlow | Auditoria (admin)</title>
  <link rel="stylesheet" href="/client/public/css/perfilPaciente.css"/>
  <link rel="stylesheet" href="/client/public/css/sidebar.css">
  <link rel="stylesheet" href="/client/public/css/configuracoes.css">
  <link rel="stylesheet" href="/client/public/css/painel-admin.css">
  <link rel="stylesheet" href="/client/public/css/admin-inbox.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="/client/public/css/dark-theme.css"/>
  <link rel="icon" type="image/png" href="/client/public/assets/logoMiniatura.png">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="/client/public/js/theme.js"></script>
</head>
<body>
  <div id="header-component"></div>
  <div id="sidebar-component"></div>
  <main class="settings-shell admin-painel-main">
    <div class="settings-container admin-painel-container">
      <div class="admin-painel-layout">
        <section class="admin-painel-card admin-painel-card--filters">
          <header class="admin-painel-header">
            <div class="admin-painel-header-text">
              <span class="admin-painel-kicker" data-i18n="admin.eyebrow">Administração</span>
              <h1 class="admin-painel-title" data-i18n="adminAudit.pageTitle">Auditoria</h1>
              <p class="admin-painel-lead" data-i18n="adminAudit.subtitle">Registro de ações.</p>
              <p class="admin-painel-lead admin-painel-lead--link"><a href="/client/views/admin-dashboard.html" data-i18n="adminValidation.linkDashboard">Dashboard</a></p>
            </div>
          </header>
        </section>
        <section class="admin-painel-card admin-painel-card--table">
          <div class="admin-painel-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th data-i18n="adminAudit.colDate">Data</th>
                  <th data-i18n="adminAudit.colAction">Ação</th>
                  <th data-i18n="adminAudit.colDetail">Detalhe</th>
                  <th data-i18n="adminAudit.colAdmin">Admin</th>
                </tr>
              </thead>
              <tbody id="auditTableBody">
                <tr><td colspan="4" class="admin-table-loading" data-i18n="adminValidation.loading">Carregando</td></tr>
              </tbody>
            </table>
            <footer class="admin-painel-pagination" id="auditPagination"></footer>
          </div>
        </section>
      </div>
    </div>
  </main>
  <script type="module" src="/client/public/js/admin-audit.js"></script>
</body>
</html>
