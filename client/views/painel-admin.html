<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oryon Health | Painel Administrativo - Validação de Médicos</title>
  <link rel="stylesheet" href="/client/public/css/perfilPaciente.css"/>
  <link rel="stylesheet" href="/client/public/css/sidebar.css">
  <link rel="stylesheet" href="/client/public/css/configuracoes.css">
  <link rel="stylesheet" href="/client/public/css/painel-admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="/client/public/css/dark-theme.css"/>
  <link rel="icon" type="image/png" href="/client/public/assets/2-removebg-preview.png">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css">
  <script src="/client/public/js/theme.js"></script>
</head>
<body>
  <div id="header-component"></div>
  <div id="sidebar-component"></div>
  <main class="settings-shell admin-painel-main">
    <div class="settings-container admin-painel-container">
      <div class="admin-painel-layout">
        <section class="admin-painel-card admin-painel-card--filters" aria-labelledby="admin-painel-heading">
          <header class="admin-painel-header">
            <div class="admin-painel-header-text">
              <span class="admin-painel-kicker" data-i18n="adminValidation.eyebrow">Administração</span>
              <h1 id="admin-painel-heading" class="admin-painel-title" data-i18n="admin.pageTitle">Validação de cadastro de médicos</h1>
              <p class="admin-painel-lead" data-i18n="admin.subtitle">Busque, filtre e analise cada solicitação no detalhe completo.</p>
              <p class="admin-painel-lead admin-painel-lead--link"><a href="/client/views/admin-dashboard.html" data-i18n="adminValidation.linkDashboard">Dashboard administrativo</a></p>
              <p class="admin-painel-lead admin-painel-lead--link"><a href="/client/views/painel-usuarios.html" data-i18n="adminValidation.linkUsers">Todos os usuários da plataforma</a></p>
              <p class="admin-painel-lead admin-painel-lead--link"><a href="/client/views/admin-newsletter.html" data-i18n="adminValidation.linkNewsletter">Newsletter</a></p>
              <p class="admin-painel-lead admin-painel-lead--link"><a href="/client/views/admin-contatos.html" data-i18n="adminValidation.linkContact">Mensagens de contato</a></p>
              <p class="admin-painel-lead admin-painel-lead--link"><a href="/client/views/admin-audit.html" data-i18n="adminValidation.linkAudit">Auditoria</a></p>
            </div>
            <div class="admin-painel-toolbar">
              <div class="admin-painel-toolbar-search">
                <i class="fas fa-search" aria-hidden="true"></i>
                <label class="visually-hidden" for="searchDoctors" data-i18n="adminValidation.searchLabel">Buscar</label>
                <input type="search" id="searchDoctors" data-i18n-placeholder="adminValidation.searchPlaceholder" placeholder="Buscar por nome, e-mail, CRM, NPI ou CPF" autocomplete="off" />
              </div>
              <div class="admin-painel-toolbar-filters">
                <select id="filterStatus" data-i18n-aria-label="adminValidation.filterStatusAria" aria-label="Filtrar por status">
                  <option value="" data-i18n="adminValidation.filterAllStatus">Todos os status</option>
                  <option value="pending_complement" data-i18n="adminValidation.filterPending">Pendente de complemento</option>
                  <option value="under_review" data-i18n="adminValidation.filterReview">Em análise</option>
                  <option value="denied" data-i18n="adminValidation.filterDenied">Negado</option>
                  <option value="approved" data-i18n="adminValidation.filterApproved">Aprovado</option>
                </select>
                <select id="sortField" data-i18n-aria-label="adminValidation.sortFieldAria" aria-label="Ordenar por">
                  <option value="enviado" data-i18n="adminValidation.sortEnviado">Data de envio</option>
                  <option value="nome" data-i18n="adminValidation.sortNome">Nome</option>
                  <option value="email" data-i18n="adminValidation.sortEmail">E-mail</option>
                  <option value="crm" data-i18n="adminValidation.sortCrm">CRM</option>
                  <option value="status" data-i18n="adminValidation.sortStatus">Status</option>
                </select>
                <select id="sortOrder" data-i18n-aria-label="adminValidation.sortOrderAria" aria-label="Ordem">
                  <option value="desc" data-i18n="adminValidation.sortDesc">Mais recente / Z→A</option>
                  <option value="asc" data-i18n="adminValidation.sortAsc">Mais antigo / A→Z</option>
                </select>
              </div>
            </div>
          </header>
          <div class="admin-painel-stats" id="adminStatsRow" aria-live="polite"></div>
        </section>

        <section class="admin-painel-card admin-painel-card--table" data-i18n-aria-label="adminValidation.tableAria" aria-label="Lista de médicos">
          <div class="admin-painel-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th data-i18n="adminValidation.colName">Nome</th>
                  <th data-i18n="adminValidation.colEmail">E-mail</th>
                  <th data-i18n="adminValidation.colCountry">País</th>
                  <th data-i18n="adminValidation.colReg">CRM / NPI</th>
                  <th data-i18n="adminValidation.colStatus">Status</th>
                  <th data-i18n="adminValidation.colSent">Enviado em</th>
                  <th class="admin-table-col-actions" data-i18n="adminValidation.colActions">Ações</th>
                </tr>
              </thead>
              <tbody id="adminTableBody">
                <tr><td colspan="7" class="admin-table-loading">Carregando…</td></tr>
              </tbody>
            </table>
            <footer class="admin-painel-pagination" id="adminPagination"></footer>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.all.min.js"></script>
  <script type="module" src="/client/public/js/painel-admin.js"></script>
  <style>
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
  </style>
</body>
</html>
