<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-i18n="sitePages.faq.docTitle">PulseFlow | FAQ</title>
  <link rel="stylesheet" href="/client/public/css/homePage.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/client/public/assets/logoMiniatura.png">
  <style>
    .page-hero {
      background: linear-gradient(135deg, #052b3b 0%, #0d1117 100%);
      padding: 12rem 5rem 10rem;
      text-align: center;
      animation: fadeIn 0.8s ease;
    }
    .page-hero h1 {
      font-size: clamp(3rem, 7vw, 5rem);
      font-weight: 200;
      margin-bottom: 2rem;
      letter-spacing: -0.04em;
      color: #ffffff;
      line-height: 1.2;
    }
    .page-hero p {
      font-size: 1.375rem;
      line-height: 1.8;
      color: #c9d1d9;
      font-weight: 300;
      max-width: 800px;
      margin: 0 auto;
    }
    .page-content {
      max-width: 1000px;
      margin: 0 auto;
      padding: 8rem 5rem;
      animation: fadeIn 1s ease;
    }
    .faq-item {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      padding: 2.5rem;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .faq-item:hover {
      border-color: #052b3b;
      box-shadow: 0 4px 12px rgba(5, 43, 59, 0.08);
    }
    .faq-item h3 {
      font-size: 1.375rem;
      font-weight: 400;
      margin-bottom: 1.25rem;
      color: #052b3b;
      letter-spacing: -0.01em;
      position: relative;
      padding-right: 3rem;
    }
    .faq-item h3::after {
      content: '+';
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      font-size: 2rem;
      font-weight: 300;
      color: #052b3b;
      transition: transform 0.3s ease;
    }
    .faq-item.active h3::after {
      transform: translateY(-50%) rotate(45deg);
    }
    .faq-item p {
      font-size: 1.0625rem;
      line-height: 1.9;
      color: #4a5568;
      font-weight: 300;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, margin 0.3s ease;
      margin-top: 0;
    }
    .faq-item.active p {
      max-height: min(1200px, 85vh);
      margin-top: 1.25rem;
    }
    .contact-section {
      background: #f8fafc;
      padding: 4rem 5rem;
      margin-top: 4rem;
      border-radius: 12px;
      text-align: center;
    }
    .contact-section h2 {
      font-size: clamp(2rem, 4vw, 2.5rem);
      font-weight: 300;
      margin-bottom: 1.5rem;
      color: #0d1117;
      letter-spacing: -0.02em;
    }
    .contact-section p {
      font-size: 1.1875rem;
      color: #4a5568;
      font-weight: 300;
      margin-bottom: 0;
    }
    .contact-section a {
      color: #052b3b;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }
    .contact-section a:hover {
      color: #0a4055;
    }
    @media (max-width: 968px) {
      .page-hero {
        padding: 10rem 3rem 8rem;
      }
      .page-content {
        padding: 6rem 3rem;
      }
    }
    @media (max-width: 768px) {
      .page-hero {
        padding: 8rem 2rem 6rem;
      }
      .page-hero h1 {
        font-size: clamp(2.5rem, 8vw, 4rem);
      }
      .page-hero p {
        font-size: 1.125rem;
      }
      .page-content {
        padding: 5rem 2rem;
      }
      .faq-item {
        padding: 2rem;
      }
      .faq-item h3 {
        font-size: 1.25rem;
        padding-right: 2.5rem;
      }
      .faq-item h3::after {
        font-size: 1.75rem;
      }
      .contact-section {
        padding: 3rem 2rem;
      }
    }
    @media (max-width: 480px) {
      .page-hero {
        padding: 7rem 1.5rem 5rem;
      }
      .page-content {
        padding: 4rem 1.5rem;
      }
      .faq-item {
        padding: 1.5rem;
      }
      .faq-item h3 {
        font-size: 1.125rem;
        padding-right: 2rem;
      }
      .faq-item p {
        font-size: 1rem;
      }
    }
  </style>
  <link rel="stylesheet" href="/client/public/css/dark-theme.css"/>
  <script src="/client/public/js/theme.js"></script>
</head>
<body>

      <a href="homePage.html">

    </div>
    <nav class="main-nav" id="mainNav">
      <a href="homePage.html" class="nav-link" data-i18n="sitePages.nav.home">HOME</a>

      <a href="sobreNos.html" class="nav-link" data-i18n="sitePages.nav.about">SOBRE</a>
      <a href="contato.html" class="nav-link" data-i18n="sitePages.nav.contact">CONTATO</a>
      <a href="faq.html" class="nav-link" data-i18n="sitePages.nav.faq">FAQ</a>
      <span class="nav-separator"></span>
      <div class="nav-dropdown" id="legalDropdown">
        <a href="#" class="nav-dropdown-toggle" data-i18n="sitePages.nav.info">INFORMAÇÕES</a>

        </div>

    </nav>
    <div class="btn-container">
      <div class="lang-switcher-home lang-switcher-legal" role="group" data-i18n-aria-label="sitePages.common.langLabel" aria-label="Idioma">
        <button type="button" class="lang-btn" data-lang="pt-BR" title="Português">PT</button>
        <span class="lang-sep" aria-hidden="true">|</span>
        <button type="button" class="lang-btn" data-lang="en" title="English">EN</button>

      <a href="login.html" class="login-button" data-i18n="sitePages.common.login">Entrar</a>

    <button class="mobile-menu-toggle" id="mobileMenuToggle" data-i18n-aria-label="sitePages.common.toggleMenu" aria-label="Menu">

  </div>

  <div id="footer-container"></div>
  <script type="module">
    import { init, applyPageTranslations, getLanguage, changeLanguage } from '/client/public/js/i18n.js';
    await init();
    applyPageTranslations();
    document.dispatchEvent(new CustomEvent('pulseflow-i18n-ready'));
    document.documentElement.lang = getLanguage() === 'en' ? 'en' : 'pt-BR';
    document.querySelectorAll('.lang-switcher-legal .lang-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const lang = btn.getAttribute('data-lang');
        if (lang && lang !== getLanguage()) changeLanguage(lang);
      });
      btn.classList.toggle('active', btn.getAttribute('data-lang') === getLanguage());
      btn.setAttribute('aria-pressed', btn.getAttribute('data-lang') === getLanguage());
    });
  </script>
  <script src="/client/public/js/homePage.js"></script>
  <script src="/client/public/js/footer.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const faqItems = document.querySelectorAll('.faq-item');
      
      faqItems.forEach(item => {
        item.addEventListener('click', function() {
          const isActive = this.classList.contains('active');
          
          faqItems.forEach(faqItem => {
            faqItem.classList.remove('active');
          });
          
          if (!isActive) {
            this.classList.add('active');
          }
        });
      });

      const mobileMenuToggle = document.getElementById('mobileMenuToggle');
      const mainNav = document.getElementById('mainNav');

      if (mobileMenuToggle && mainNav) {
        mobileMenuToggle.addEventListener('click', function() {
          this.classList.toggle('active');
          mainNav.classList.toggle('active');
        });

        document.querySelectorAll('.nav-link').forEach(link => {
          link.addEventListener('click', function() {
            mobileMenuToggle.classList.remove('active');
            mainNav.classList.remove('active');
          });
        });
      }

      const header = document.querySelector('.main-header');
      if (header) {
        let lastScroll = 0;
        window.addEventListener('scroll', function() {
          const currentScroll = window.pageYOffset;
          if (currentScroll > 100) {
            header.classList.add('scrolled');
          } else {
            header.classList.remove('scrolled');
          }
          lastScroll = currentScroll;
        });
      }
    });
  </script>
</body>
</html>
