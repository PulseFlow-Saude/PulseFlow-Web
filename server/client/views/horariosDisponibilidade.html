<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oryon Health | Horários</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/client/public/css/perfilPaciente.css"/>
  <link rel="stylesheet" href="/client/public/css/sidebar.css">
  <link rel="stylesheet" href="/client/public/css/horariosDisponibilidade.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css">
  <link rel="icon" type="image/png" href="/client/public/assets/2-removebg-preview.png">
  <link rel="stylesheet" href="/client/public/css/dark-theme.css"/>
  <script src="/client/public/js/theme.js"></script>
</head>
<body>
  <div id="header-component"></div>
  <div id="sidebar-component"></div>
  <div class="container">
    <main class="content horarios-content">
      <div class="page-header">
      <h1><i class="fas fa-clock"></i> <span data-i18n="horarios.title">Meus Horários de Trabalho</span></h1>
      <p data-i18n="horarios.subtitle">Configure os horários em que você está disponível para atender pacientes</p>
    </div>

    <div class="actions-bar">
      <button id="addHorarioBtn" class="btn-primary">
        <i class="fas fa-plus"></i> <span data-i18n="horarios.add">Adicionar Horário</span>
      </button>
      <div class="actions-right">
        <div class="bulk-actions" id="bulkActions">
          <label class="bulk-select-all">
            <input type="checkbox" id="selectAllHorarios" />
            <span data-i18n="horarios.selectAll">Selecionar todos</span>
          </label>
          <button id="deleteSelectedBtn" class="btn-danger" type="button" disabled>
            <i class="fas fa-trash"></i> <span data-i18n="horarios.deleteSelected">Excluir selecionados</span> (<span id="selectedCount">0</span>)
          </button>
        </div>
        <div class="filter-group">
        <label>
          <input type="checkbox" id="showInactive" />
          <span data-i18n="horarios.showInactive">Mostrar horários inativos</span>
        </label>
        </div>
      </div>
    </div>

    <section id="horarioPanel" class="horario-panel" style="display: none;">
      <div class="horario-panel-header">
        <h2 id="panelTitle" data-i18n="horarios.add">Adicionar Horário</h2>
        <button class="btn-secondary" id="closePanelBtn" type="button">
          <i class="fas fa-times"></i> <span data-i18n="horarios.close">Fechar</span>
        </button>
      </div>
      <form id="horarioForm" class="horario-panel-form">
        <input type="hidden" id="horarioId" />

        <div class="form-group">
          <label for="diaSemana" data-i18n="horarios.weekDayLabel">Dia da Semana *</label>
          <select id="diaSemana" required>
            <option value="" data-i18n="horarios.selectDay">Selecione o dia</option>
            <option value="0" data-i18n="agendamentos.weekDay0">Domingo</option>
            <option value="1" data-i18n="agendamentos.weekDay1">Segunda-feira</option>
            <option value="2" data-i18n="agendamentos.weekDay2">Terça-feira</option>
            <option value="3" data-i18n="agendamentos.weekDay3">Quarta-feira</option>
            <option value="4" data-i18n="agendamentos.weekDay4">Quinta-feira</option>
            <option value="5" data-i18n="agendamentos.weekDay5">Sexta-feira</option>
            <option value="6" data-i18n="agendamentos.weekDay6">Sábado</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="horaInicio" data-i18n="horarios.startTime">Hora de Início *</label>
            <input type="time" id="horaInicio" required />
          </div>
          <div class="form-group">
            <label for="horaFim" data-i18n="horarios.endTime">Hora de Fim *</label>
            <input type="time" id="horaFim" required />
          </div>
        </div>

        <div class="form-group">
          <label for="duracaoConsulta" data-i18n="horarios.durationLabel">Duração da Consulta (minutos) *</label>
          <select id="duracaoConsulta" required>
            <option value="15" data-i18n="agendamentos.minutes15">15 minutos</option>
            <option value="30" selected data-i18n="agendamentos.minutes30">30 minutos</option>
            <option value="45" data-i18n="agendamentos.minutes45">45 minutos</option>
            <option value="60" data-i18n="agendamentos.minutes60">60 minutos</option>
            <option value="90" data-i18n="agendamentos.minutes90">90 minutos</option>
            <option value="120" data-i18n="agendamentos.minutes120">120 minutos</option>
          </select>
        </div>

        <div class="form-group repeat-toggle-group">
          <label>
            <input type="checkbox" id="repeatDaysToggle" />
            <span data-i18n="horarios.repeatOtherDays">Repetir este horário em outros dias</span>
          </label>
        </div>

        <div id="repeatDaysSection" class="repeat-days-section" style="display: none;">
          <p class="repeat-days-hint" data-i18n="horarios.repeatHint">Selecione os dias adicionais para criar o mesmo horário automaticamente:</p>
          <div class="repeat-days-grid">
            <label><input type="checkbox" class="repeat-day-checkbox" value="0" /> <span data-i18n="agendamentos.weekDay0">Domingo</span></label>
            <label><input type="checkbox" class="repeat-day-checkbox" value="1" /> <span data-i18n="agendamentos.weekDay1">Segunda-feira</span></label>
            <label><input type="checkbox" class="repeat-day-checkbox" value="2" /> <span data-i18n="agendamentos.weekDay2">Terça-feira</span></label>
            <label><input type="checkbox" class="repeat-day-checkbox" value="3" /> <span data-i18n="agendamentos.weekDay3">Quarta-feira</span></label>
            <label><input type="checkbox" class="repeat-day-checkbox" value="4" /> <span data-i18n="agendamentos.weekDay4">Quinta-feira</span></label>
            <label><input type="checkbox" class="repeat-day-checkbox" value="5" /> <span data-i18n="agendamentos.weekDay5">Sexta-feira</span></label>
            <label><input type="checkbox" class="repeat-day-checkbox" value="6" /> <span data-i18n="agendamentos.weekDay6">Sábado</span></label>
          </div>
        </div>

        <div class="form-group">
          <label for="observacoes" data-i18n="horarios.observations">Observações</label>
          <textarea id="observacoes" rows="3" data-i18n-placeholder="horarios.observationsPlaceholder" placeholder="Ex: Atendimento apenas pela manhã"></textarea>
        </div>

        <div class="form-group checkbox-group">
          <label>
            <input type="checkbox" id="ativo" checked />
            <span data-i18n="horarios.active">Horário ativo</span>
          </label>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="cancelForm" data-i18n="horarios.cancel">Cancelar</button>
          <button type="submit" class="btn-primary" id="saveHorarioBtn">
            <i class="fas fa-save"></i> <span data-i18n="horarios.save">Salvar</span>
          </button>
        </div>
      </form>
    </section>

    <div id="horariosList" class="horarios-list">
      <div class="loading" id="loading">
        <i class="fas fa-spinner fa-spin"></i> <span data-i18n="horarios.loading">Carregando horários...</span>
      </div>
    </div>

    <div id="emptyState" class="empty-state" style="display: none;">
      <i class="fas fa-calendar-times"></i>
      <h3 data-i18n="horarios.emptyTitle">Nenhum horário cadastrado</h3>
      <p data-i18n="horarios.emptyDesc">Comece adicionando seus horários de disponibilidade</p>
    </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.all.min.js"></script>
  <script type="module" src="/client/public/js/horariosDisponibilidade.js"></script>
</body>
</html>
