<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-i18n="sitePages.contact.docTitle">PulseFlow | Contato</title>
  <link rel="stylesheet" href="/client/public/css/homePage.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/client/public/assets/logoMiniatura.png">
  <style>
    .page-hero {
      background: linear-gradient(135deg, #052b3b 0%, #0d1117 100%);
      padding: 12rem 5rem 10rem;
      text-align: center;
      animation: fadeIn 0.8s ease;
    }
    .page-hero h1 {
      font-size: clamp(3rem, 7vw, 5rem);
      font-weight: 200;
      margin-bottom: 2rem;
      letter-spacing: -0.04em;
      color: #ffffff;
      line-height: 1.2;
    }
    .page-hero p {
      font-size: 1.375rem;
      line-height: 1.8;
      color: #c9d1d9;
      font-weight: 300;
      max-width: 800px;
      margin: 0 auto;
    }
    .page-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 8rem 5rem;
      animation: fadeIn 1s ease;
    }
    .contact-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 3rem;
      margin-bottom: 6rem;
    }
    .contact-card {
      background: #ffffff;
      padding: 3.5rem;
      border: 1px solid #e5e7eb;
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }
    .contact-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: #052b3b;
      transform: scaleY(0);
      transition: transform 0.4s ease;
    }
    .contact-card:hover::before {
      transform: scaleY(1);
    }
    .contact-card:hover {
      box-shadow: 0 12px 32px rgba(5, 43, 59, 0.12);
      transform: translateY(-4px);
    }
    .contact-icon {
      width: 56px;
      height: 56px;
      margin-bottom: 1.5rem;
      color: #052b3b;
      opacity: 0.95;
    }
    .contact-card h3 {
      font-size: 1.375rem;
      font-weight: 400;
      margin-bottom: 1rem;
      color: #0d1117;
      letter-spacing: -0.01em;
    }
    .contact-card p {
      font-size: 1.0625rem;
      line-height: 1.8;
      color: #4a5568;
      font-weight: 300;
      margin: 0;
    }
    .contact-card a {
      color: #052b3b;
      text-decoration: none;
      font-weight: 400;
      transition: color 0.3s ease;
    }
    .contact-card a:hover {
      color: #0a4055;
    }
    .form-section {
      background: #f8fafc;
      padding: 5rem;
      border-radius: 8px;
      animation: fadeIn 1.2s ease;
    }
    .form-section h2 {
      font-size: clamp(2rem, 4vw, 2.75rem);
      font-weight: 300;
      margin-bottom: 3rem;
      letter-spacing: -0.02em;
      color: #0d1117;
      text-align: center;
    }
    .contact-form {
      max-width: 700px;
      margin: 0 auto;
    }
    .form-group {
      margin-bottom: 2rem;
    }
    .form-group label {
      display: block;
      font-size: 0.9375rem;
      font-weight: 400;
      color: #1a202c;
      margin-bottom: 0.75rem;
      letter-spacing: 0.02em;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 1rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 1rem;
      font-family: 'Montserrat', sans-serif;
      transition: all 0.3s ease;
      background: #ffffff;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #052b3b;
      box-shadow: 0 0 0 3px rgba(5, 43, 59, 0.1);
    }
    .form-group textarea {
      min-height: 140px;
      resize: vertical;
    }
    .submit-button {
      background-color: #052b3b;
      color: white;
      padding: 1.125rem 3.5rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .submit-button:hover {
      background-color: #0a4055;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(5, 43, 59, 0.3);
    }
    .form-actions {
      text-align: center;
    }
    .page-content .form-section {
      margin-top: 3rem;
    }
    .contact-form-feedback {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #047857;
    }
    .contact-form-feedback.is-error {
      color: #b91c1c;
    }
    .contact-form-feedback[hidden] {
      display: none !important;
    }
    @media (max-width: 1024px) {
      .page-hero {
        padding: 10rem 3rem 8rem;
      }
      .page-content {
        padding: 6rem 3rem;
      }
      .form-section {
        padding: 4rem 3rem;
      }
      .contact-cards {
        grid-template-columns: repeat(2, 1fr);
        gap: 2.5rem;
      }
    }
    @media (max-width: 768px) {
      .mobile-menu-toggle {
        display: flex;
      }
      .main-nav {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: white;
        flex-direction: column;
        padding: 2rem;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        gap: 1rem;
        z-index: 1000;
      }
      .main-nav.active {
        display: flex;
      }
      .page-hero {
        padding: 8rem 2rem 6rem;
      }
      .page-hero h1 {
        font-size: 2.5rem;
      }
      .page-hero p {
        font-size: 1.125rem;
      }
      .page-content {
        padding: 4rem 2rem;
      }
      .contact-cards {
        grid-template-columns: 1fr;
        gap: 2rem;
        margin-bottom: 4rem;
      }
      .contact-card {
        padding: 2.5rem 2rem;
      }
      .form-section {
        padding: 3rem 2rem;
      }
      .form-section h2 {
        font-size: 2rem;
      }
    }
    @media (max-width: 480px) {
      .page-hero {
        padding: 6rem 1.5rem 4rem;
      }
      .page-hero h1 {
        font-size: 2rem;
      }
      .page-hero p {
        font-size: 1rem;
      }
      .page-content {
        padding: 3rem 1.5rem;
      }
      .contact-cards {
        gap: 1.5rem;
      }
      .contact-card {
        padding: 2rem 1.5rem;
      }
      .contact-icon {
        width: 44px;
        height: 44px;
      }
      .contact-card h3 {
        font-size: 1.2rem;
      }
      .contact-card p {
        font-size: 0.95rem;
      }
      .form-section {
        padding: 2.5rem 1.5rem;
      }
      .form-section h2 {
        font-size: 1.75rem;
      }
      .submit-button {
        width: 100%;
        padding: 1rem 2rem;
      }
    }
  </style>
  <link rel="stylesheet" href="/client/public/css/dark-theme.css"/>
  <script src="/client/public/js/theme.js"></script>
</head>
<body>
  <header class="main-header">
    <div class="logo">
      <a href="homePage.html">
        <img src="/client/public/assets/pulseLogo.png" alt="" data-i18n-alt="sitePages.common.logoAlt">
      </a>
    </div>
    <nav class="main-nav" id="mainNav">
      <a href="homePage.html" class="nav-link" data-i18n="sitePages.nav.home">HOME</a>
      <a href="homePage.html#features" class="nav-link" data-i18n="sitePages.nav.areas">ÁREAS DE ATUAÇÃO</a>
      <a href="sobreNos.html" class="nav-link" data-i18n="sitePages.nav.about">SOBRE</a>
      <a href="contato.html" class="nav-link" data-i18n="sitePages.nav.contact">CONTATO</a>
      <a href="faq.html" class="nav-link" data-i18n="sitePages.nav.faq">FAQ</a>
      <span class="nav-separator"></span>
      <div class="nav-dropdown" id="legalDropdown">
        <a href="#" class="nav-dropdown-toggle" data-i18n="sitePages.nav.info">INFORMAÇÕES</a>
        <div class="nav-dropdown-menu">
          <a href="termos.html" class="nav-dropdown-link" data-i18n="sitePages.nav.terms">Termos de Uso</a>
          <a href="privacidade.html" class="nav-dropdown-link" data-i18n="sitePages.nav.privacy">Política de Privacidade</a>
          <a href="seguranca.html" class="nav-dropdown-link" data-i18n="sitePages.nav.security">Segurança e compliance</a>
        </div>
      </div>
    </nav>
    <div class="btn-container">
      <div class="lang-switcher-home lang-switcher-legal" role="group" data-i18n-aria-label="sitePages.common.langLabel" aria-label="Idioma">
        <button type="button" class="lang-btn" data-lang="pt-BR" title="Português">PT</button>
        <span class="lang-sep" aria-hidden="true">|</span>
        <button type="button" class="lang-btn" data-lang="en" title="English">EN</button>
      </div>
      <a href="login.html" class="login-button" data-i18n="sitePages.common.login">Entrar</a>
    </div>
    <button class="mobile-menu-toggle" id="mobileMenuToggle" data-i18n-aria-label="sitePages.common.toggleMenu" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <section class="page-hero">
    <h1 data-i18n="sitePages.contact.heroTitle">Fale conosco</h1>
    <p data-i18n="sitePages.contact.heroLead">…</p>
  </section>

  <div class="page-content">
    <div class="contact-cards">
      <div class="contact-card">
        <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        <h3 data-i18n="sitePages.contact.card1Title">Horário de atendimento</h3>
        <p data-i18n="sitePages.contact.card1Text">…</p>
      </div>

      <div class="contact-card">
        <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        <h3 data-i18n="sitePages.contact.card2Title">E-mail</h3>
        <p data-i18n-html="sitePages.contact.card2TextHtml">…</p>
      </div>
    </div>

    <section class="form-section" aria-labelledby="contact-form-heading">
      <h2 id="contact-form-heading" data-i18n="sitePages.contact.formTitle">Envie uma mensagem</h2>
      <form class="contact-form" id="contactPageForm" novalidate>
        <div class="form-group">
          <label for="contactName" data-i18n="sitePages.contact.formName">Nome completo</label>
          <input type="text" id="contactName" name="name" maxlength="200" required autocomplete="name" data-i18n-placeholder="sitePages.contact.formNamePh" placeholder="Seu nome" />
        </div>
        <div class="form-group">
          <label for="contactEmail" data-i18n="sitePages.contact.formEmail">E-mail</label>
          <input type="email" id="contactEmail" name="email" required autocomplete="email" data-i18n-placeholder="sitePages.contact.formEmailPh" placeholder="seu@email.com" />
        </div>
        <div class="form-group">
          <label for="contactMessage" data-i18n="sitePages.contact.formMessage">Mensagem</label>
          <textarea id="contactMessage" name="message" required minlength="10" maxlength="8000" data-i18n-placeholder="sitePages.contact.formMessagePh" placeholder=""></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="submit-button" data-i18n="sitePages.contact.formSubmit">Enviar mensagem</button>
        </div>
        <p class="contact-form-feedback" id="contactFormFeedback" role="status" aria-live="polite" hidden></p>
      </form>
    </section>
  </div>

  <div id="footer-container"></div>
  <script type="module">
    import { init, applyPageTranslations, getLanguage, changeLanguage } from '/client/public/js/i18n.js';
    import { API_URL } from '/client/public/js/config.js';
    await init();
    applyPageTranslations();
    document.dispatchEvent(new CustomEvent('pulseflow-i18n-ready'));
    document.documentElement.lang = getLanguage() === 'en' ? 'en' : 'pt-BR';
    document.querySelectorAll('.lang-switcher-legal .lang-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const lang = btn.getAttribute('data-lang');
        if (lang && lang !== getLanguage()) changeLanguage(lang);
      });
      btn.classList.toggle('active', btn.getAttribute('data-lang') === getLanguage());
      btn.setAttribute('aria-pressed', btn.getAttribute('data-lang') === getLanguage());
    });

    const contactForm = document.getElementById('contactPageForm');
    const contactFeedback = document.getElementById('contactFormFeedback');
    const tx = (key, fb) => (typeof window.pulseflowT === 'function' ? window.pulseflowT(key, { fallback: fb }) : fb);
    if (contactForm && contactFeedback) {
      contactForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = (contactForm.querySelector('[name=name]')?.value || '').trim();
        const email = (contactForm.querySelector('[name=email]')?.value || '').trim();
        const message = (contactForm.querySelector('[name=message]')?.value || '').trim();
        contactFeedback.hidden = false;
        contactFeedback.classList.remove('is-error');
        if (!name) {
          contactFeedback.textContent = tx('sitePages.contact.formErrName', 'Informe seu nome.');
          contactFeedback.classList.add('is-error');
          return;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          contactFeedback.textContent = tx('sitePages.contact.formErrEmail', 'Informe um e-mail válido.');
          contactFeedback.classList.add('is-error');
          return;
        }
        if (message.length < 10) {
          contactFeedback.textContent = tx('sitePages.contact.formErrMessage', 'Mensagem muito curta.');
          contactFeedback.classList.add('is-error');
          return;
        }
        contactFeedback.textContent = tx('sitePages.contact.formSending', 'Enviando…');
        try {
          const res = await fetch(`${API_URL}/api/contact`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
            body: JSON.stringify({ name, email, message })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'fail');
          contactFeedback.textContent = tx('sitePages.contact.formOk', 'Mensagem recebida.');
          contactFeedback.classList.remove('is-error');
          contactForm.reset();
        } catch {
          contactFeedback.textContent = tx('sitePages.contact.formErr', 'Erro ao enviar.');
          contactFeedback.classList.add('is-error');
        }
      });
    }
  </script>
  <script src="/client/public/js/homePage.js"></script>
  <script src="/client/public/js/footer.js"></script>
</body>
</html>
